    <path d="M319 781q49-49 116-35 59-54 128-27 65-50 132-12 77-27 134 23 65 5 96 49-47 21-113 11-72 25-133 4-72 25-138 3-80 24-133-1-47 12-89-15z" fill="#a3b6a0"/>
    <path d="M332 799q78-20 139 0 78-21 143-1 73-23 147 5 45 6 86-3l-39 31q-56 1-84 23l-63-15-70 45-58-23-73 37-48-29-81 18-35-31z" fill="#78968d"/>
