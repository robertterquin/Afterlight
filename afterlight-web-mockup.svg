    <g fill="#ffe0a7"><circle cx="407" cy="744" r="2.5"/><circle cx="450" cy="747" r="2"/><circle cx="766" cy="742" r="2.5"/><circle cx="807" cy="746" r="2"/></g>
    <path d="M365 808q54 9 102 0m224 22q69-12 132 1m-377 29q44-8 84 0" stroke="#d2e0cd" stroke-width="2" opacity=".29" fill="none" stroke-linecap="round"/>

    <!-- Tower bloom -->
    <circle cx="592" cy="476" r="88" fill="url(#beaconGlow)" opacity=".72" filter="url(#bloom)"/>
    <path d="M575 482L552 343Q590 384 628 343L606 482Z" fill="url(#beaconRay)"/>
    <circle cx="591" cy="482" r="14" fill="#ffe5b4" opacity=".42" filter="url(#soft)"/>

    <!-- Eight placed stones, subtly faceted -->
    <g>
      <g><path d="M477 775l11-9h210l-11 9z" fill="url(#stoneTop)"/><path d="M477 775h210v35H477z" fill="url(#stoneFace)"/><path d="M687 775l11-9v35l-11 5z" fill="url(#stoneEdge)"/><path d="M496 785h10v13h-10zm35 0h10v13h-10zm35 0h10v13h-10zm35 0h10v13h-10zm35 0h10v13h-10z" fill="#ffdfaa" opacity=".83"/></g>
      <g><path d="M485 735l10-9h192l-10 9z" fill="url(#stoneTop)"/><path d="M485 735h192v35H485z" fill="url(#stoneFace)"/><path d="M677 735l10-9v35l-10 5z" fill="url(#stoneEdge)"/><path d="M506 745h10v13h-10zm35 0h10v13h-10zm35 0h10v13h-10zm35 0h10v13h-10z" fill="#ffdfaa" opacity=".84"/></g>
      <g><path d="M493 695l9-9h173l-9 9z" fill="url(#stoneTop)"/><path d="M493 695h173v35H493z" fill="url(#stoneFace)"/><path d="M666 695l9-9v35l-9 5z" fill="url(#stoneEdge)"/><path d="M514 705h10v13h-10zm34 0h10v13h-10zm34 0h10v13h-10zm34 0h10v13h-10z" fill="#ffdfaa" opacity=".84"/></g>
      <g><path d="M502 655l9-9h151l-9 9z" fill="url(#stoneTop)"/><path d="M502 655h151v35H502z" fill="url(#stoneFace)"/><path d="M653 655l9-9v35l-9 5z" fill="url(#stoneEdge)"/><path d="M522 665h10v13h-10zm34 0h10v13h-10zm34 0h10v13h-10z" fill="#ffdfaa" opacity=".85"/></g>
      <g><path d="M510 615l8-9h135l-8 9z" fill="url(#stoneTop)"/><path d="M510 615h135v35H510z" fill="url(#stoneFace)"/><path d="M645 615l8-9v35l-8 5z" fill="url(#stoneEdge)"/><path d="M530 625h10v13h-10zm34 0h10v13h-10zm34 0h10v13h-10z" fill="#ffe3b2" opacity=".86"/></g>
