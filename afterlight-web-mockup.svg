    <path d="M1212 478h308" stroke="#2b4355" stroke-width="1"/>
    <g>
      <circle cx="1228" cy="520" r="15" fill="#84969b"/>
      <text x="1228" y="524" fill="#f5f0e5" font-size="11" text-anchor="middle" font-weight="700">2</text>
