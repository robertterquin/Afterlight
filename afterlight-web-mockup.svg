    <path d="M1212 372h308" stroke="#3c5362" stroke-width="1"/>
    <text x="1212" y="399" fill="#829a9f" font-size="10" letter-spacing="1">PLAYER</text>
    <text x="1519" y="399" fill="#829a9f" font-size="10" letter-spacing="1" text-anchor="end">HEIGHT</text>

    <g>
