<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Afterlight — refined web game mockup</title>
  <desc id="desc">A quiet twilight game screen: a luminous block tower connects floating islands, with a compact daily leaderboard.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1">
      <stop stop-color="#0a1926"/><stop offset="1" stop-color="#122738"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#17263a"/><stop offset=".37" stop-color="#3f4d69"/>
      <stop offset=".68" stop-color="#9b7481"/><stop offset=".86" stop-color="#e1a77f"/>
      <stop offset="1" stop-color="#315c6b"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#456f7b"/><stop offset="1" stop-color="#142e42"/>
    </linearGradient>
    <linearGradient id="stoneTop" x2="0" y2="1">
      <stop stop-color="#e5f0d8"/><stop offset="1" stop-color="#b8d8bd"/>
    </linearGradient>
    <linearGradient id="stoneFace" x2="0" y2="1">
      <stop stop-color="#85b6a6"/><stop offset="1" stop-color="#5d928d"/>
    </linearGradient>
    <linearGradient id="stoneEdge" x2="0" y2="1">
      <stop stop-color="#63968e"/><stop offset="1" stop-color="#416e78"/>
    </linearGradient>
    <linearGradient id="goldTop" x2="0" y2="1">
      <stop stop-color="#fff0c9"/><stop offset="1" stop-color="#edc18d"/>
    </linearGradient>
    <linearGradient id="goldFace" x2="0" y2="1">
      <stop stop-color="#dba975"/><stop offset="1" stop-color="#b87e61"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop stop-color="#f5d9b4" stop-opacity=".5"/><stop offset="1" stop-color="#f5d9b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beaconGlow">
      <stop stop-color="#ffe4b4" stop-opacity=".62"/><stop offset="1" stop-color="#ffe4b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beaconRay" x2="0" y2="1">
      <stop stop-color="#ffe3b0" stop-opacity="0"/><stop offset=".8" stop-color="#ffe3b0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffe3b0" stop-opacity=".46"/>
    </linearGradient>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="playfield"><rect x="48" y="88" width="1100" height="864" rx="28"/></clipPath>
    <style>
      .ui { font-family: 'Avenir Next', 'Segoe UI', sans-serif; }
      .display { font-family: 'Georgia', 'Times New Roman', serif; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>
  <circle cx="778" cy="480" r="500" fill="#243e50" opacity=".12"/>

  <!-- Quiet game chrome -->
  <g class="ui">
    <g transform="translate(59 24)">
      <path d="M3 30h28l-4-5H7z" fill="#e6b783"/>
      <path d="M9 25V9l8-6 8 6v16z" fill="#dcebd7"/>
      <path d="M14 12h7v6h-7z" fill="#e6b783"/>
      <path d="M17 0v-3M8 4 5 1m21 3 3-3" stroke="#e6b783" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="101" y="46" fill="#eef0e6" font-size="16" font-weight="700" letter-spacing="2.2">AFTERLIGHT</text>
    <circle cx="1480" cy="39" r="19" fill="#152b3b" stroke="#526b75" stroke-opacity=".5"/>
    <path d="M1472 36h4l6-5v16l-6-5h-4z" fill="none" stroke="#c6d2ca" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M1485 34q6 5 0 10" fill="none" stroke="#c6d2ca" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="1530" cy="39" r="19" fill="#152b3b" stroke="#526b75" stroke-opacity=".5"/>
    <path d="M1526 31v16m8-16v16" stroke="#c6d2ca" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main game world -->
