    </g>
    <path d="M1212 553h308" stroke="#2b4355" stroke-width="1"/>
    <g>
      <circle cx="1228" cy="595" r="15" fill="#8e7568"/>
      <text x="1228" y="599" fill="#f5f0e5" font-size="11" text-anchor="middle" font-weight="700">3</text>
      <circle cx="1268" cy="595" r="16" fill="#cb8b75"/>
      <path d="M1259 600q9-18 18 0-9-5-18 0z" fill="#fff0d7"/>
      <text x="1295" y="600" fill="#dce5dc" font-size="14">littlecomet</text>
      <text x="1519" y="601" fill="#dce5dc" font-size="18" text-anchor="end">26</text>
    </g>

    <path d="M1212 633h308" stroke="#3c5362" stroke-width="1"/>
    <rect x="1204" y="652" width="324" height="75" rx="16" fill="#213d4f" stroke="#d4ad7d" stroke-opacity=".5"/>
