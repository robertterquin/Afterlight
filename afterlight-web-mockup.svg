    <rect x="48" y="88" width="1100" height="864" fill="url(#sky)"/>
    <circle cx="876" cy="355" r="190" fill="url(#moonGlow)"/>
    <circle cx="876" cy="355" r="47" fill="#f2d8b5" opacity=".94"/>
    <path d="M888 314a47 47 0 1 0 31 76 43 43 0 0 1-31-76z" fill="#d2aa99" opacity=".28"/>

    <!-- Dust and distant stars -->
    <g fill="#f4e7cc">
      <circle cx="153" cy="233" r="1.4" opacity=".78"/><circle cx="232" cy="317" r="1" opacity=".62"/>
      <circle cx="324" cy="197" r="1.2" opacity=".72"/><circle cx="415" cy="287" r="1.5" opacity=".7"/>
      <circle cx="516" cy="220" r="1" opacity=".76"/><circle cx="654" cy="166" r="1.4" opacity=".75"/>
      <circle cx="744" cy="270" r="1.2" opacity=".72"/><circle cx="1009" cy="231" r="1.2" opacity=".7"/>
      <circle cx="1078" cy="370" r="1.3" opacity=".7"/><circle cx="966" cy="165" r="1" opacity=".7"/>
      <circle cx="283" cy="424" r="1" opacity=".55"/><circle cx="710" cy="380" r="1.3" opacity=".67"/>
      <circle cx="188" cy="391" r="1.2" opacity=".62"/><circle cx="1042" cy="447" r="1" opacity=".7"/>
    </g>
    <g stroke="#f4e7cc" stroke-width="1" opacity=".58" stroke-linecap="round">
      <path d="M367 233v7m-3.5-3.5h7"/><path d="M1020 322v6m-3-3h6"/><path d="M585 348v6m-3-3h6"/>
    </g>

    <!-- Layered dusk ridges -->
    <path d="M48 590q104-72 208-23 95-81 197-16 108-88 220-8 116-82 223-12 114-66 252 14v155H48z" fill="#55546f" opacity=".68"/>
    <path d="M48 670q119-64 225-20 100-65 205-4 105-74 224-8 115-68 224-9 99-50 222-6v131H48z" fill="#354b61" opacity=".89"/>
    <path d="M48 741q129-40 237 9 102-43 216 6 117-46 226 1 107-43 213-3 92-33 208 5v98H48z" fill="#2a4359"/>

    <!-- Left island: small lantern village -->
    <g>
      <ellipse cx="224" cy="588" rx="135" ry="20" fill="#142b40" opacity=".3"/>
      <path d="M96 548q28-48 77-39 46-42 97-3 49-12 79 35l-18 23q-49 4-72 31l-36-4-41 27-26-17-43 7-15-30-31-8z" fill="#253f54"/>
