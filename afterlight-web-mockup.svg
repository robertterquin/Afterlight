      <g><path d="M534 495l7-9h87l-7 9z" fill="url(#stoneTop)"/><path d="M534 495h87v35h-87z" fill="url(#stoneFace)"/><path d="M621 495l7-9v35l-7 5z" fill="url(#stoneEdge)"/><path d="M553 505h10v13h-10zm34 0h10v13h-10z" fill="#fff0c9"/></g>
    </g>

