      <ellipse cx="955" cy="557" rx="128" ry="18" fill="#172d40" opacity=".28"/>
      <path d="M832 516q29-46 78-37 47-39 91-1 51-10 81 35l-21 23q-46 7-71 29l-35-7-39 29-26-17-41 4-14-28-31-8z" fill="#294355"/>
      <path d="M845 511q30-34 73-28 48-39 89 0 47-7 66 34-30 13-69 5-43 18-83 1-38 11-76-12z" fill="#a1b4a0"/>
      <path d="M911 500h28v32h-28z" fill="#d7ad82"/><path d="M905 501l20-19 20 19z" fill="#f2d7ae"/>
