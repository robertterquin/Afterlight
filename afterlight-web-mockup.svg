    <path d="M533 493h96" stroke="#fff0d0" stroke-width="1" stroke-dasharray="3 7" opacity=".53"/>
    <path d="M665 454h81" stroke="#ffe6bd" stroke-width="1" stroke-dasharray="2 8" opacity=".37"/>
    <g><path d="M667 461l7-8h82l-7 8z" fill="url(#goldTop)"/><path d="M667 461h82v30h-82z" fill="url(#goldFace)"/><path d="M749 461l7-8v30l-7 5z" fill="#a86d59"/><path d="M685 471h9v10h-9zm31 0h9v10h-9z" fill="#fff0cd" opacity=".82"/></g>
    <path d="M774 447q28-8 51 0m-38 10q18-5 31 1" stroke="#f2d1ae" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".59"/>
    <path d="M830 447l7-1-4 6" fill="none" stroke="#f2d1ae" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".59"/>

