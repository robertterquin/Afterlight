    <rect x="645" y="894" width="52" height="22" rx="6" fill="#e1e5d9" fill-opacity=".1" stroke="#cfd9d1" stroke-opacity=".23"/>
    <text x="671" y="909" fill="#d0dbd3" font-size="9" letter-spacing=".6" text-anchor="middle">SPACE</text>
  </g>

  <!-- Compact daily leaderboard -->
